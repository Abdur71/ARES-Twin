services:
  # =========================================================================
  # 1. Backend Web Service (FastAPI / Python 3.12)
  # =========================================================================
  - type: web
    name: ares-twin-backend
    env: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: HOST
        value: 0.0.0.0
      - key: DEBUG
        value: "false"
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "http://localhost:3000,https://*.onrender.com,https://*.vercel.app"

  # =========================================================================
  # 2. Frontend Web Service (Next.js / Node.js)
  # =========================================================================
  - type: web
    name: ares-twin-frontend
    env: node
    plan: free
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npx next start -p $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_URL
        sync: false
